    <style>
        :root {
            --bg-color: #0d1117;
            --text-color: #c9d1d9;
            --column-bg: #161b22;
            --border-color: #30363d;
            --accent-blue: #58a6ff;
            --card-bg: #21262d;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }
        h1 {
            margin: 0;
            color: var(--accent-blue);
            font-size: 24px;
        }
        .board {
            display: flex;
            gap: 20px;
            flex-grow: 1;
            overflow-x: auto;
            padding-bottom: 10px;
        }
        .column {
            background: var(--column-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            min-width: 320px;
            width: 25%;
            display: flex;
            flex-direction: column;
        }
        .column-header {
            padding: 15px;
            font-weight: bold;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .count {
            background: rgba(139, 148, 158, 0.2);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
        }
        .task-list {
            padding: 10px;
            flex-grow: 1;
            overflow-y: auto;
            min-height: 100px;
        }
        .task-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: grab;
            display: flex;
            flex-direction: column;
            gap: 8px;
            user-select: none;
        }
        .task-card:active {
            cursor: grabbing;
        }
        .task-title {
            font-weight: 600;
            font-size: 15px;
            color: #ffffff;
        }
        .task-desc {
            font-size: 13px;
            color: #8b949e;
        }
        .task-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            margin-top: 4px;
        }
        .badge {
            padding: 4px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }
        .dept-map { background: rgba(88, 166, 255, 0.15); color: var(--accent-blue); }
        .dept-buildings { background: rgba(137, 87, 229, 0.15); color: #8957e5; }
        .dept-scripting { background: rgba(63, 185, 80, 0.15); color: #3fb950; }
        .dept-ui { background: rgba(210, 153, 34, 0.15); color: #d29922; }
        .dept-jobs { background: rgba(255, 123, 114, 0.15); color: #ff7b72; }
        .dept-qa { background: rgba(165, 214, 255, 0.15); color: #a5d6ff; }
        
        .pri-critical { color: #f85149; font-weight: bold; }
        .pri-high { color: #d29922; font-weight: bold; }
        .pri-medium { color: #58a6ff; }
        .pri-low { color: #8b949e; }
        
        .budget-tag {
            color: #3fb950;
            font-family: monospace;
            font-size: 13px;
        }
    </style>
</head>

        function getDeptClass(dept) {
            dept = dept.toLowerCase();
            if (dept.includes('map') || dept.includes('preproduction')) return 'dept-map';
            if (dept.includes('building')) return 'dept-buildings';
            if (dept.includes('scripting') || dept.includes('vehicle') || dept.includes('department') || dept.includes('economy')) return 'dept-scripting';
            if (dept.includes('ui') || dept.includes('audio')) return 'dept-ui';
            if (dept.includes('job') || dept.includes('housing')) return 'dept-jobs';
            if (dept.includes('qa') || dept.includes('release') || dept.includes('reserve')) return 'dept-qa';
            return 'dept-map'; 
        }

        function getPriClass(pri) {
            pri = pri.toLowerCase();
            if (pri === 'critical') return 'pri-critical';
            if (pri === 'high') return 'pri-high';
            if (pri === 'low') return 'pri-low';
            return 'pri-medium';
        }

        function renderTasks() {
            const list = document.getElementById('not-started');
            
            mapleShadesJobs.forEach(job => {
                const card = document.createElement('div');
                card.className = 'task-card';
                card.id = 'task-' + job.id;
                card.draggable = true;
                card.ondragstart = drag;

                card.innerHTML = `
                    <div class="task-title">#${job.id} - ${job.task}</div>
                    <div class="task-desc">${job.desc} | <b>Assigned:</b> ${job.dev}</div>
                    <div class="task-meta-row">
                        <span class="badge ${getDeptClass(job.dept)}">${job.dept}</span>
                        <span class="${getPriClass(job.pri)}">${job.pri}</span>
                    </div>
                    <div class="task-meta-row">
                        <span>⏱️ ${job.time}</span>
                        <span class="budget-tag">R$ ${job.budget}</span>
                    </div>
                `;
                list.appendChild(card);
            });
            updateCounts();
        }

        function allowDrop(ev) { ev.preventDefault(); }
        function drag(ev) { ev.dataTransfer.setData("text", ev.currentTarget.id); }
        
        function drop(ev) {
            ev.preventDefault();
            const data = ev.dataTransfer.getData("text");
            const element = document.getElementById(data);
            
            let targetList = ev.target;
            while (!targetList.classList.contains('task-list') && targetList !== document.body) {
                targetList = targetList.parentElement;
            }
            
            if (targetList.classList.contains('task-list')) {
                targetList.appendChild(element);
                updateCounts();
                sendWebhookNotification(element.id, targetList.id);
            }
        }

        // Safe webhook function that checks if URL is provided before attempting fetch
        function sendWebhookNotification(taskId, targetColumn) {
            if (!DISCORD_WEBHOOK_URL || DISCORD_WEBHOOK_URL.trim() === "") {
                return; // Skips execution safely if no webhook has been added yet
            }

            const payload = {
                content: `Task **${taskId}** moved to column: **${targetColumn}**`
            };

            fetch(DISCORD_WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).catch(err => console.log("Webhook skipped or failed safely:", err));
        }

        function updateCounts() {
            document.getElementById('count-not-started').textContent = document.getElementById('not-started').children.length;
            document.getElementById('count-in-progress').textContent = document.getElementById('in-progress').children.length;
            document.getElementById('count-testing').textContent = document.getElementById('testing').children.length;
            document.getElementById('count-done').textContent = document.getElementById('done').children.length;
        }

        window.onload = renderTasks;
    </script>
